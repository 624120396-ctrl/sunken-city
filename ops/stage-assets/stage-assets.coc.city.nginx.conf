# Install as /etc/nginx/sites-available/stage-assets.coc.city and enable only
# after the delivery configuration/readiness checks documented alongside it.
server {
    listen 80;
    server_name stage-assets.coc.city;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stage-assets.coc.city;
    ssl_certificate /etc/letsencrypt/live/stage-assets.coc.city/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage-assets.coc.city/privkey.pem;
    server_tokens off;
    access_log off;

    location /delivery/ {
        proxy_pass http://127.0.0.1:3001/api/stage-assets/delivery/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location / { return 404; }
}
