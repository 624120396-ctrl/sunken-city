version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: coc-db
    environment:
      POSTGRES_USER: coc
      POSTGRES_PASSWORD: coc
      POSTGRES_DB: coc_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coc -d coc_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile.dev
    container_name: coc-server
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://coc:coc@db:5432/coc_platform
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-production
      PORT: 3001
    volumes:
      - ./apps/server/src:/app/src
      - ./apps/server/prisma:/app/prisma
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run dev

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: coc-web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_WS_URL: ws://localhost:3001
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/index.html:/app/index.html
      - /app/node_modules
    depends_on:
      - server
    command: npm run dev

volumes:
  postgres_data:
  redis_data: